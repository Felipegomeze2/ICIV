name: Actualizar Dashboard ICIV

on:
  schedule:
    # Semanal: lunes 7am UTC (2am Venezuela) — fuentes de alta frecuencia
    - cron: '0 7 * * 1'
    # Mensual: día 1 a las 8am UTC — además refresca las fuentes ANUALES.
    # Sin esto, WDI/WGI/OIT/UNCTAD/HDI/PTS/WJP/Freedom House solo se actualizaban
    # cuando alguien las corría a mano, y el índice arrastraba datos viejos
    # aunque el publicador ya hubiera sacado el año siguiente.
    - cron: '0 8 1 * *'

  # Ejecución manual desde GitHub → Actions → "Run workflow"
  workflow_dispatch:
    inputs:
      fetch_data:
        description: '¿Descargar datos frescos? (true = fetch completo, false = usar CSVs del repo)'
        required: false
        default: 'false'
        type: boolean
      fetch_anual:
        description: '¿Refrescar también las fuentes anuales (WDI, WGI, OIT, UNCTAD, HDI, PTS, WJP, FH)?'
        required: false
        default: 'false'
        type: boolean

# Permisos para escribir al repo (commit del dashboard actualizado)
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    name: Regenerar dashboard
    runs-on: ubuntu-latest
    outputs:
      # Se expone para que el job de alerta pueda marcar la corrida en rojo
      # DESPUÉS de haber publicado el dashboard.
      vigencia: ${{ steps.vigencia.outcome }}

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install -e "iciv/[dev]"
          pip install statsmodels scikit-learn pydantic matplotlib

      # ── Fetch de datos frescos (solo si fetch_data=true o si es lunes ──────
      - name: Fetch datos de alta frecuencia (FRED, EIA, Guardian, GDELT, IMF)
        if: ${{ github.event.inputs.fetch_data == 'true' || github.event_name == 'schedule' }}
        working-directory: iciv
        env:
          EIA_API_KEY:      ${{ secrets.EIA_API_KEY }}
          GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
          ACLED_EMAIL:      ${{ secrets.ACLED_EMAIL }}
          ACLED_PASSWORD:   ${{ secrets.ACLED_PASSWORD }}
          COMTRADE_API_KEY: ${{ secrets.COMTRADE_API_KEY }}
          EARTHDATA_TOKEN:  ${{ secrets.EARTHDATA_TOKEN }}
        run: |
          echo "Descargando datos frescos de fuentes de alta frecuencia..."
          # FRED — datos públicos, sin API key
          python scripts/fetch_fred.py         || echo "WARN: fetch_fred falló (continuando)"
          python scripts/fetch_fred_monthly.py || echo "WARN: fetch_fred_monthly falló (continuando)"
          # EIA — requiere EIA_API_KEY en secrets
          python scripts/fetch_eia.py          || echo "WARN: fetch_eia falló (continuando)"
          python scripts/fetch_eia_monthly.py  || echo "WARN: fetch_eia_monthly falló (continuando)"
          # Guardian — requiere GUARDIAN_API_KEY en secrets
          python scripts/fetch_guardian.py          || echo "WARN: fetch_guardian falló (continuando)"
          python scripts/fetch_guardian_monthly.py  || echo "WARN: fetch_guardian_monthly falló (continuando)"
          # GDELT DOC — público, rate-limita por frecuencia: se pide por tramos anuales
          # (4 por corrida) y la serie se acumula semana a semana. Gate lo marca opcional.
          python scripts/fetch_gdelt_monthly.py --years 4 || echo "WARN: fetch_gdelt_monthly falló (continuando)"
          # IMF IMTS — comercio espejo EEUU-VEN (mirror statistics, sin origen venezolano)
          python scripts/fetch_imts_monthly.py      || echo "WARN: fetch_imts_monthly falló (continuando)"
          # World Bank Pink Sheet — crudo Dubai mensual
          python scripts/fetch_wb_commodities_monthly.py || echo "WARN: fetch_wb_commodities falló (continuando)"
          # ACLED — eventos de conflicto (requiere secrets ACLED_EMAIL/ACLED_PASSWORD; si faltan, avisa y continua)
          python scripts/fetch_acled_monthly.py     || echo "WARN: fetch_acled_monthly falló (continuando)"
          # UN Comtrade — comercio espejo de socios adicionales (requiere COMTRADE_API_KEY; si falta, avisa y continua)
          python scripts/fetch_comtrade_monthly.py  || echo "WARN: fetch_comtrade_monthly falló (continuando)"
          # NASA Black Marble — luminosidad mensual (requiere EARTHDATA_TOKEN; avanza el backfill 4 meses por semana)
          python scripts/fetch_blackmarble_monthly.py --months 4 || echo "WARN: fetch_blackmarble falló (continuando)"
          python scripts/fetch_international_news.py || echo "WARN: fetch_international_news falló (continuando)"
          # IMF — datos públicos, sin API key
          python scripts/fetch_imf.py          || echo "WARN: fetch_imf falló (continuando)"
          # UNHCR — datos públicos
          python scripts/fetch_unhcr.py        || echo "WARN: fetch_unhcr falló (continuando)"
          echo "Fetch completado."

      # ── Fetch de fuentes ANUALES ────────────────────────────────────────────
      # Solo el día 1 de cada mes o si se pide a mano. Estas fuentes publican una
      # o dos veces al año (WGI en septiembre, HDI en septiembre, WDI en diciembre,
      # CPI en enero), así que pedirlas cada lunes no aporta y sí gasta cuota.
      #
      # Cada script lleva la guarda de iciv/src/iciv/utils/safe_save.py: si la
      # descarga viene vacía no sobrescribe el CSV y sale con código distinto de
      # cero, que el `|| echo WARN` convierte en aviso visible sin abortar el resto.
      - name: Fetch fuentes anuales (WDI, WGI, OIT, UNCTAD, HDI, PTS, WJP, FH)
        if: ${{ github.event.schedule == '0 8 1 * *' || github.event.inputs.fetch_anual == 'true' }}
        working-directory: iciv
        run: |
          echo "Refrescando fuentes anuales institucionales..."
          python scripts/fetch_wdi.py            || echo "WARN: fetch_wdi falló (continuando)"
          python scripts/fetch_wgi.py            || echo "WARN: fetch_wgi falló (continuando)"
          python scripts/fetch_ilostat.py        || echo "WARN: fetch_ilostat falló (continuando)"
          python scripts/fetch_unctad.py         || echo "WARN: fetch_unctad falló (continuando)"
          python scripts/fetch_hdi.py            || echo "WARN: fetch_hdi falló (continuando)"
          python scripts/fetch_pts.py            || echo "WARN: fetch_pts falló (continuando)"
          python scripts/fetch_wjp.py            || echo "WARN: fetch_wjp falló (continuando)"
          python scripts/fetch_freedom_house.py  || echo "WARN: fetch_freedom_house falló (continuando)"
          # V-Dem NO entra al indice: alimenta la validacion convergente
          python scripts/fetch_vdem.py           || echo "WARN: fetch_vdem falló (continuando)"
          echo "Fetch anual completado."

      # ── Control de vigencia de TODAS las fuentes ────────────────────────────
      # Los fetchers van envueltos en `|| echo WARN`, así que el paso anterior
      # reporta success aunque alguno falle. Este control mira el RESULTADO —el
      # último dato de cada CSV— y no el código de salida del fetcher, así que
      # detecta tanto "el fetch falló" como "el fetch corrió pero trajo datos
      # viejos". Escribe un resumen en la portada del run y emite anotaciones.
      #
      # continue-on-error: el dashboard debe generarse igual. Si una fuente
      # crítica está caída, la corrida se marca en rojo al final (último paso),
      # pero el producto se publica con la cobertura que corresponda.
      - name: Control de vigencia de fuentes
        id: vigencia
        continue-on-error: true
        working-directory: iciv
        run: |
          python scripts/check_data_freshness.py

      - name: Verificar vigencia de fuentes Pulse
        working-directory: iciv
        run: |
          python scripts/check_pulse_inputs.py

      # ── Ejecutar pipeline (genera nuevo iciv_dashboard.html) ─────────────
      - name: Ejecutar pipeline ICIV
        working-directory: iciv
        run: |
          python main.py --no-fetch --no-open
          echo "Pipeline completado. Dashboard generado."

      # ── Verificar que el dashboard se generó correctamente ──────────────
      - name: Verificar dashboard
        run: |
          if [ -f "iciv_dashboard.html" ]; then
            SIZE=$(du -k "iciv_dashboard.html" | cut -f1)
            echo "OK iciv_dashboard.html generado — ${SIZE} KB"
            if [ "$SIZE" -lt 100 ]; then
              echo "ERROR: Dashboard demasiado pequeño (${SIZE} KB). Algo falló."
              exit 1
            fi
          else
            echo "ERROR: iciv_dashboard.html no encontrado"
            exit 1
          fi

      # ── Commit del dashboard actualizado de vuelta al repo ───────────────
      - name: Commit dashboard actualizado
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Añadir dashboard y datos crudos actualizados (si hubo fetch)
          git add iciv_dashboard.html
          git add iciv/data/raw/ || true
          git add iciv/data/releases/latest/ || true
          git add iciv/data/processed/pulse_forecast_backtest*.csv || true

          # Solo hacer commit si hay cambios
          if git diff --quiet --cached; then
            echo "Sin cambios — dashboard ya estaba actualizado."
          else
            FECHA=$(date +'%Y-%m-%d')
            git commit -m "chore: auto-update dashboard ${FECHA} [Actions]"
            git push
            echo "Dashboard actualizado y publicado."
          fi

  # ── Deploy a GitHub Pages (corre después del commit) ────────────────────
  deploy-pages:
    name: Deploy a GitHub Pages
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout (con el commit más reciente)
        uses: actions/checkout@v4
        with:
          ref: main  # Asegura que toma el commit del paso anterior

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'   # Sube toda la raíz del repo (incluye index.html + iciv_dashboard.html)

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ── Alerta de fuentes caídas ─────────────────────────────────────────────
  # Job separado y al final a propósito. El dashboard ya se generó, se commiteó
  # y se publicó; este job no bloquea nada. Lo único que hace es que la corrida
  # NO aparezca en verde cuando el índice se publicó con una fuente crítica
  # desactualizada. Sin esto, un fallo de fetch queda enterrado en los logs y
  # nadie lo ve: fue exactamente lo que pasó del 3 al 11 de agosto de 2026,
  # cuando el índice se publicó ocho días sin la dimensión D6.
  alerta-fuentes:
    name: Alerta de fuentes desactualizadas
    needs: [update, deploy-pages]
    if: always() && needs.update.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Señalar fuentes críticas desactualizadas
        if: needs.update.outputs.vigencia == 'failure'
        run: |
          echo "::error title=Fuentes criticas desactualizadas::El dashboard se publico, pero al menos una fuente critica esta fuera de su tolerancia. Revisa la tabla 'Vigencia de fuentes ICIV' en el resumen de esta corrida."
          exit 1

      - name: Todo en orden
        if: needs.update.outputs.vigencia != 'failure'
        run: echo "Todas las fuentes criticas dentro de su tolerancia."
