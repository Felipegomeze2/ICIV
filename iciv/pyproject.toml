[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "iciv"
version = "0.2.0"
description = "Indicador de Clima de Inversion Venezuela - Tesis Big Data"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2,<3.1",
    "numpy>=1.26,<3",
    "pydantic>=2,<3",
    "scikit-learn>=1.4,<2",
    "statsmodels>=0.14,<0.15",
    "requests>=2.31",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
    "scipy>=1.11",
    "vaderSentiment>=3.3",
    "py7zr>=0.20",
    "h5py>=3.9",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "mypy>=1.5",
    "pandas-stubs>=2.0",
]
viz = [
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "plotly>=5.15",
    "streamlit>=1.28",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
